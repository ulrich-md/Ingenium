<svg xmlns="http://www.w3.org/2000/svg" aria-label="Psi, preocupado, junto a una marca roja de corrección" class="psi psi--ups psi-anim" viewBox="0 0 240 240"><style><![CDATA[/* Psi's animations. Each moving part of src/components/Gato.tsx has a class and carries its own pivot
   (an inline transform-origin in viewBox units), so these rules never need coordinates.
   Only on Gato with `animated`, and never for people who ask for less motion. */

.psi .g-iris { transition: transform 0.18s ease-out; }

@media (prefers-reduced-motion: no-preference) {
  /* always: blink, breathe, swish */
  .psi-anim .g-eyes { animation: psi-blink 4.6s infinite; transform-box: fill-box; transform-origin: center; }
  .psi-anim .g-body { animation: psi-breathe 3.2s ease-in-out infinite; transform-box: view-box; }
  .psi-anim .g-tail { animation: psi-swish 2.6s ease-in-out infinite; transform-box: view-box; }
  .psi-anim .g-head { animation: psi-tilt 5s ease-in-out infinite; transform-box: view-box; }
  .psi-anim .g-star { animation: psi-twinkle 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .psi-anim .g-star:nth-of-type(2n) { animation-delay: 0.5s; }

  /* per part */
  .psi-anim .g-wave { animation: psi-wave 1.1s ease-in-out infinite; transform-box: view-box; }
  .psi-anim .g-point { animation: psi-point 1.4s ease-in-out infinite; transform-box: view-box; }
  .psi-anim .g-flame { animation: psi-flicker 0.9s ease-in-out infinite alternate; transform-box: view-box; }
  .psi-anim .g-hand { animation: psi-spin 3s linear infinite; transform-box: view-box; }
  .psi-anim .g-tear { animation: psi-drip 2.2s ease-in infinite; transform-box: view-box; }
  .psi-anim .g-ghost { animation: psi-ghost 2.4s ease-in-out infinite; }
  .psi-anim .g-z text { animation: psi-z 2.4s ease-in-out infinite; }
  .psi-anim .g-z text:nth-child(2) { animation-delay: 0.4s; }
  .psi-anim .g-z text:nth-child(3) { animation-delay: 0.8s; }
  .psi-anim .g-jump { animation: psi-hop 1.3s cubic-bezier(.3, .7, .4, 1) infinite; transform-box: view-box; }

  /* per pose */
  .psi-anim.psi--ups .g-head, .psi-anim.psi--insiste .g-head { animation: psi-shake 0.45s ease-in-out 3, psi-tilt 5s ease-in-out 1.35s infinite; }
  .psi-anim.psi--duerme .g-head { animation: psi-snore 3.6s ease-in-out infinite; }
  .psi-anim.psi--sube .g-head { animation: none; }

  /* one-shot actions, added by script: peek into the box, jump, react */
  .psi.do-peek .g-peek { animation: psi-peek 1.4s cubic-bezier(.5, 0, .3, 1) 1; }
  .psi.do-jump { animation: psi-jump 0.7s cubic-bezier(.3, .7, .4, 1) 1; transform-origin: 50% 95%; }
}

@keyframes psi-blink { 0%, 94%, 100% { transform: scaleY(1); } 96.5% { transform: scaleY(0.08); } }
@keyframes psi-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, 1.03); } }
@keyframes psi-swish { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(9deg); } }
@keyframes psi-tilt { 0%, 70%, 100% { transform: rotate(0deg); } 80% { transform: rotate(-4deg); } 90% { transform: rotate(2deg); } }
@keyframes psi-twinkle { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.55); opacity: 0.6; } }
@keyframes psi-wave { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-16deg); } }
@keyframes psi-point { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(5px, -2px); } }
@keyframes psi-flicker { 0% { transform: scale(1, 1) rotate(-2deg); } 100% { transform: scale(1.05, 1.1) rotate(2deg); } }
@keyframes psi-spin { to { transform: rotate(360deg); } }
@keyframes psi-drip { 0%, 30% { transform: translateY(0); opacity: 1; } 90% { transform: translateY(16px); opacity: 0; } 100% { opacity: 0; } }
@keyframes psi-ghost { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes psi-z { 0%, 100% { opacity: 0.35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-6px); } }
@keyframes psi-hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 12% { transform: translateY(0) scale(1.06, 0.92); } 45% { transform: translateY(-16px) scale(0.97, 1.04); } 78% { transform: translateY(0) scale(1.04, 0.96); } }
@keyframes psi-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
@keyframes psi-snore { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(1.5px) scale(1.02, 0.98); } }
@keyframes psi-peek { 0% { transform: translateY(0); } 35%, 55% { transform: translateY(70px); } 100% { transform: translateY(0); } }
@keyframes psi-jump { 0%, 100% { transform: translateY(0) scale(1, 1); } 15% { transform: translateY(0) scale(1.05, 0.93); } 50% { transform: translateY(-8%) scale(0.97, 1.04); } 80% { transform: translateY(0) scale(1.03, 0.97); } }
]]></style><ellipse cx="130" cy="226" fill="#d5dee9" rx="96" ry="7"/><path fill="#b06d30" stroke="#b06d30" stroke-linejoin="round" stroke-width="4" d="m52 150 20-13h138l-20 13Z"/><path fill="#d9954b" stroke="#d9954b" stroke-linejoin="round" stroke-width="5" d="m72 137 10-29h124l4 29Z"/><path fill="#f8d196" stroke="#f8d196" stroke-linejoin="round" stroke-width="5" d="m52 150 20-13-24-21-20 15Z"/><g class="g-head" style="transform-origin:122px 158px"><path fill="#3d5a7c" stroke="#3d5a7c" stroke-linejoin="round" stroke-width="9" d="M85.735 115.113 61.631 68.648l44.404 5.03Z"/><path fill="#ffa3c6" stroke="#ffa3c6" stroke-linejoin="round" stroke-width="5" d="m85.657 100.69-14-24.33 24.7 2.64Z"/><path fill="#2b4565" stroke="#2b4565" stroke-linejoin="round" stroke-width="9" d="m158.265 115.113 24.104-46.465-44.404 5.03Z"/><path fill="#ffa3c6" stroke="#ffa3c6" stroke-linejoin="round" stroke-width="5" d="m158.343 100.69 14-24.33-24.7 2.64Z"/><path fill="none" stroke="#2bb5ff" stroke-linecap="round" stroke-width="7" d="M92 151q30 16 60 0"/><path fill="#3d5a7c" d="M72 118c0-30 20-42 50-42s50 12 50 42c2 26-20 40-50 40s-52-14-50-40"/><clipPath id="psi-ups-head"><path d="M72 118c0-30 20-42 50-42s50 12 50 42c2 26-20 40-50 40s-52-14-50-40"/></clipPath><g clip-path="url(#psi-ups-head)"><ellipse cx="164" cy="153.9" fill="#2b4565" opacity=".55" rx="62" ry="41"/><ellipse cx="100" cy="89.12" fill="#56769c" opacity=".45" rx="30" ry="13.12"/></g><g fill="none" stroke="#8fd9ff" stroke-linecap="round" stroke-width="4"><path d="M109 89q4.333-3.4 8.667 0t8.666 0q4.334-3.4 8.667 0"/><path d="M73 122q3.25-2.6 6.5 0t6.5 0" opacity=".85"/><path d="M158 122q3.25-2.6 6.5 0t6.5 0" opacity=".85"/></g><circle cx="112.5" cy="135" r="11.5" fill="#f6f9fc"/><circle cx="131.5" cy="135" r="11.5" fill="#f6f9fc"/><circle cx="122" cy="142" r="9.5" fill="#f6f9fc"/><g class="g-eyes"><clipPath id="psi-ups-eyeL"><circle cx="103" cy="115" r="12.5"/></clipPath><circle cx="103" cy="115" r="12.5" fill="#fff"/><g class="g-iris" clip-path="url(#psi-ups-eyeL)"><circle cx="105.6" cy="112.4" r="9.8" fill="#0b7fc4"/><circle cx="105" cy="111.8" r="8.6" fill="#2bb5ff"/><circle cx="105.6" cy="112.4" r="5.2" fill="#0d1b2a"/><circle cx="109.4" cy="108.4" r="3.3" fill="#fff"/><circle cx="102" cy="116.2" r="1.5" fill="#fff"/></g><clipPath id="psi-ups-eyeR"><circle cx="141" cy="115" r="12.5"/></clipPath><circle cx="141" cy="115" r="12.5" fill="#fff"/><g class="g-iris" clip-path="url(#psi-ups-eyeR)"><circle cx="143.6" cy="112.4" r="9.8" fill="#d18f00"/><circle cx="143" cy="111.8" r="8.6" fill="#ffc23d"/><circle cx="143.6" cy="112.4" r="5.2" fill="#0d1b2a"/><circle cx="147.4" cy="108.4" r="3.3" fill="#fff"/><circle cx="140" cy="116.2" r="1.5" fill="#fff"/></g><path fill="none" stroke="#f6f9fc" stroke-linecap="round" stroke-width="3" d="M95 98q8-6 16-5"/><path fill="none" stroke="#f6f9fc" stroke-linecap="round" stroke-width="3" d="M149 98q-8-6-16-5"/></g><rect width="11" height="7.5" x="116.5" y="125" fill="#ff7eb0" rx="3.75"/><path fill="none" stroke="#0d1b2a" stroke-linecap="round" stroke-width="2.6" d="M115 139q3.5-4 7 0t7 0"/><g fill="none" stroke="#f6f9fc" stroke-linecap="round" stroke-width="1.8" opacity=".8"><path d="M100 133q-16-5-34-3"/><path d="M100 138q-16 0-32 5"/><path d="M144 133q16-5 34-3"/><path d="M144 138q16 0 32 5"/></g><circle cx="122" cy="165" r="8.5" fill="#e9a400"/><circle cx="121.3" cy="164.3" r="7.6" fill="#ffc23d"/><text x="121.3" y="168.4" fill="#0d1b2a" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="700" text-anchor="middle">Ψ</text></g><path fill="#d9954b" stroke="#d9954b" stroke-linejoin="round" stroke-width="5" d="m190 150 20-13v70l-20 13Z"/><path fill="#f8d196" stroke="#f8d196" stroke-linejoin="round" stroke-width="5" d="m190 150 20-13 21 15-19 14Z"/><rect width="142" height="74" x="50" y="148" fill="#efb76a" rx="6"/><rect width="142" height="12" x="50" y="210" fill="#d9954b" opacity=".4" rx="6"/><path fill="none" stroke="#d9954b" stro